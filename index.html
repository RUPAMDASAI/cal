<!DOCTYPE html>
<html>
<head>
    <title>Colorful Calculator</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .calculator {
            background: #1e1e2f;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.4);
        }

        #display {
            width: 260px;
            height: 60px;
            font-size: 28px;
            text-align: right;
            border: none;
            border-radius: 10px;
            margin-bottom: 15px;
            padding: 10px;
            background: black;
            color: white;
        }

        .row {
            display: flex;
        }

        .btn {
            width: 60px;
            height: 60px;
            margin: 5px;
            font-size: 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            transform: scale(1.1);
        }

        .purple { background: #9b59b6; color: white; }
        .blue { background: #3498db; color: white; }
        .green { background: #2ecc71; color: white; }
        .red { background: #e74c3c; color: white; }
        .gray { background: #7f8c8d; color: white; }

        .equals {
            background: linear-gradient(45deg, #ff6a00, #ff0000);
            color: white;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="calculator">

    <input type="text" id="display" value="0" readonly>

    <div class="row">
        <button class="btn red" onclick="clearDisplay()">AC</button>
        <button class="btn purple" onclick="append('(')">(</button>
        <button class="btn purple" onclick="append(')')">)</button>
        <button class="btn blue" onclick="append('/')">÷</button>
    </div>

    <div class="row">
        <button class="btn gray" onclick="append('7')">7</button>
        <button class="btn gray" onclick="append('8')">8</button>
        <button class="btn gray" onclick="append('9')">9</button>
        <button class="btn blue" onclick="append('*')">×</button>
    </div>

    <div class="row">
        <button class="btn gray" onclick="append('4')">4</button>
        <button class="btn gray" onclick="append('5')">5</button>
        <button class="btn gray" onclick="append('6')">6</button>
        <button class="btn blue" onclick="append('-')">-</button>
    </div>

    <div class="row">
        <button class="btn gray" onclick="append('1')">1</button>
        <button class="btn gray" onclick="append('2')">2</button>
        <button class="btn gray" onclick="append('3')">3</button>
        <button class="btn blue" onclick="append('+')">+</button>
    </div>

    <div class="row">
        <button class="btn green" onclick="append('0')">0</button>
        <button class="btn green" onclick="append('.')">.</button>
        <button class="btn equals" onclick="calculate()">=</button>
    </div>

</div>

<script>
    let display = document.getElementById("display");

    function append(value) {
        if (display.value === "0") {
            display.value = value;
        } else {
            display.value += value;
        }
    }

    function clearDisplay() {
        display.value = "0";
    }

    function calculate() {
        try {
            display.value = eval(display.value);
        } catch {
            display.value = "Error";
        }
    }
</script>

</body>
</html>
